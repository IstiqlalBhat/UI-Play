<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #080810;
            --bg-mid: #0e0e1c;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.14);
            --text: rgba(255, 255, 255, 0.88);
            --text-dim: rgba(255, 255, 255, 0.4);
            --accent-a: #6e5ce7;
            --accent-b: #a78bfa;
            --accent-c: #f0abfc;
        }

        body {
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text);
        }

        /* ── ambient glow ── */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            translate: -50% -55%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 92, 231, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3.5rem;
            padding: 2rem;
        }

        /* ── header ── */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--accent-a), var(--accent-b) 50%, var(--accent-c));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.01em;
        }

        /* ── nav ── */
        .nav {
            display: flex;
            gap: 1rem;
        }

        .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1.6rem;
            text-decoration: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }

        /* shimmer line on top edge */
        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-b), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .nav-link:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(110, 92, 231, 0.1);
        }

        .nav-link:hover::before {
            opacity: 1;
        }

        .nav-link:active {
            transform: translateY(0);
        }

        /* icon dot */
        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .nav-link:nth-child(1) .nav-dot { background: var(--accent-a); box-shadow: 0 0 8px rgba(110, 92, 231, 0.5); }
        .nav-link:nth-child(2) .nav-dot { background: var(--accent-b); box-shadow: 0 0 8px rgba(167, 139, 250, 0.5); }
        .nav-link:nth-child(3) .nav-dot { background: var(--accent-c); box-shadow: 0 0 8px rgba(240, 171, 252, 0.5); }

        /* arrow */
        .nav-arrow {
            margin-left: 0.25rem;
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.3s ease;
        }

        .nav-link:hover .nav-arrow {
            opacity: 0.5;
            transform: translateX(0);
        }

        .nav-arrow svg {
            display: block;
            width: 14px;
            height: 14px;
        }

        /* ── footer ── */
        .footer {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .footer a {
            color: var(--text-dim);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent-b);
            border-color: var(--accent-b);
        }

        /* ── entrance stagger ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header   { animation: fadeUp 0.6s ease-out both; }
        .nav      { animation: fadeUp 0.6s ease-out 0.15s both; }
        .footer   { animation: fadeUp 0.6s ease-out 0.3s both; }

        /* ── responsive ── */
        @media (max-width: 680px) {
            .nav {
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }

            .title {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 380px) {
            .title {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .nav-link {
                padding: 0.8rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">
            <h1 class="title">UI Play</h1>
            <p class="subtitle">A collection of beautiful UI I've recreated and am inspired by</p>
        </div>

        <nav class="nav">
            <a href="switch.html" class="nav-link">
                <span class="nav-dot"></span>
                Jelly Switch
                <span class="nav-arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
            </a>
            <a href="slider.html" class="nav-link">
                <span class="nav-dot"></span>
                Jelly Slider
                <span class="nav-arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
            </a>
            <a href="buttons.html" class="nav-link">
                <span class="nav-dot"></span>
                Shader Buttons
                <span class="nav-arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
            </a>
        </nav>

        <p class="footer"><a href="https://github.com/IstiqlalBhat/UI-Play" target="_blank">GitHub</a></p>
    </div>
</body>

</html>
