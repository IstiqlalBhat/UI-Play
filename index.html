<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Play - Premium Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #030305;
            --accent-1: #7c3aed;
            --accent-2: #c026d3;
            --accent-3: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Noise Texture Overlay */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 999;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Dynamic Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-1);
            top: -10%;
            left: -10%;
            animation-delay: -2s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-2);
            bottom: -5%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--accent-3);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-duration: 25s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Mouse Spotlight */
        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(255, 255, 255, 0.06),
                    transparent 40%);
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: slideDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1rem;

            /* Glossy text effect */
            background: linear-gradient(to right,
                    #fff 20%,
                    var(--accent-2) 40%,
                    var(--accent-2) 60%,
                    #fff 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 8s linear infinite;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Navigation Cards */
        .nav-grid {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            perspective: 1000px;
        }

        .nav-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);

            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            min-width: 220px;
            justify-content: space-between;
        }

        .nav-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .nav-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .nav-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card Hover Effects */
        .nav-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow:
                0 20px 40px -10px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(192, 38, 211, 0.1) inset;
        }

        /* Ambient Glow Behind Card */
        .nav-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            background: radial-gradient(circle at var(--card-mouse-x, 50%) var(--card-mouse-y, 50%),
                    rgba(255, 255, 255, 0.15),
                    transparent 50%);
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .nav-card:hover::after {
            opacity: 1;
        }

        /* Glowing Dots */
        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            z-index: 2;
        }

        .nav-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: inherit;
            filter: blur(4px);
            opacity: 0.6;
        }

        /* Match the existing accent colors for each dot */
        .nav-card:nth-child(1) .nav-dot {
            background: #38bdf8;
        }

        /* Jelly Switch */
        .nav-card:nth-child(2) .nav-dot {
            background: #a855f7;
        }

        /* Jelly Slider */
        .nav-card:nth-child(3) .nav-dot {
            background: #ec4899;
        }

        /* Shader Buttons */

        .card-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 2;
        }

        .nav-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-5px);
            opacity: 0.5;
            z-index: 2;
        }

        .nav-card:hover .nav-arrow {
            transform: translateX(0);
            opacity: 1;
            color: var(--text-main);
        }

        .footer {
            margin-top: 5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            animation: fadeIn 1s ease 1s forwards;
            opacity: 0;
            z-index: 2;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        .footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent-1);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .footer a:hover {
            color: var(--text-main);
        }

        .footer a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
            }

            .nav-grid {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                max-width: 380px;
            }

            .orb {
                opacity: 0.2;
            }

            .nav-card {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <div class="spotlight"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <header class="header">
            <h1 class="title">UI Play</h1>
            <p class="subtitle">A collection of beautiful UI I've recreated and am inspired by</p>
        </header>

        <nav class="nav-grid">
            <a href="switch.html" class="nav-card">
                <div class="card-content">
                    <div class="nav-dot"></div>
                    <span>Jelly Switch</span>
                </div>
                <div class="nav-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <a href="slider.html" class="nav-card">
                <div class="card-content">
                    <div class="nav-dot"></div>
                    <span>Jelly Slider</span>
                </div>
                <div class="nav-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <a href="buttons.html" class="nav-card">
                <div class="card-content">
                    <div class="nav-dot"></div>
                    <span>Shader Buttons</span>
                </div>
                <div class="nav-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </nav>

        <div class="footer">
            <a href="https://github.com/IstiqlalBhat/UI-Play" target="_blank">GitHub</a>
        </div>
    </div>

    <script>
        // Global mouse spotlight
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        });

        // Add 3D tilt effect and custom mouse tracking per card
        const cards = document.querySelectorAll('.nav-card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // For the inner glow
                const xPercentage = (x / rect.width) * 100;
                const yPercentage = (y / rect.height) * 100;
                card.style.setProperty('--card-mouse-x', `${xPercentage}%`);
                card.style.setProperty('--card-mouse-y', `${yPercentage}%`);

                // For the tilt
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10; // Max tilt 10deg
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)`;
            });
        });
    </script>
</body>

</html>
