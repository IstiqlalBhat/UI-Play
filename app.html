<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="JellyOS - A liquid glass UI prototype" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JellyOS | Liquid Glass Interface</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================
           JellyOS - Unified Liquid Glass Design
           Components blend seamlessly with UI
        ======================================== */

        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-bg-hover: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-light: rgba(255, 255, 255, 0.2);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-blue: #60a5fa;
            --accent-purple: #a78bfa;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* ========================================
           Full-Screen WebGPU Canvas Layer
           The 3D components render on this layer
        ======================================== */
        .canvas-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .canvas-layer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ========================================
           Glass UI Overlay Layer
           Transparent panels float above the 3D scene
        ======================================== */
        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .ui-layer>* {
            pointer-events: auto;
        }

        /* ========================================
           Top Bar
        ======================================== */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .topbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
        }

        .topbar-item {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .topbar-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .topbar-time {
            font-weight: 500;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        /* ========================================
           Floating Info Panels
           Small glass cards that label the 3D components
        ======================================== */
        .info-panel {
            position: fixed;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 180px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: panelAppear 0.6s var(--spring);
        }

        @keyframes panelAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
        }

        .info-panel h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .info-panel .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .info-panel .status.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Panel positions - positioned near where the 3D components render */
        .panel-switch {
            top: 60px;
            left: 40px;
        }

        .panel-slider {
            bottom: 120px;
            right: 40px;
        }

        /* Large value display for slider */
        .value-display {
            position: fixed;
            bottom: 200px;
            right: 40px;
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 60px rgba(167, 139, 250, 0.5);
            animation: panelAppear 0.8s var(--spring);
        }

        @media (max-width: 768px) {
            .panel-switch {
                top: 50px;
                left: 16px;
                right: 16px;
                min-width: auto;
            }

            .panel-slider {
                bottom: 100px;
                right: 16px;
                left: 16px;
                min-width: auto;
            }

            .value-display {
                position: fixed;
                bottom: 180px;
                left: 16px;
                right: auto;
                font-size: 48px;
            }
        }

        /* ========================================
           Dock
        ======================================== */
        .dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .dock-item {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s var(--spring);
            position: relative;
        }

        .dock-item:hover {
            transform: translateY(-12px) scale(1.2);
        }

        .dock-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
        }

        .dock-item.settings {
            background: linear-gradient(135deg, #6b7280, #374151);
        }

        .dock-item.finder {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .dock-item.music {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .dock-item.photos {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .dock-item.terminal {
            background: linear-gradient(135deg, #1f2937, #111827);
        }

        /* ========================================
           Hint overlay
        ======================================== */
        .hint {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease 2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* WebGPU Error */
        .error-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 24px;
        }

        .error-overlay h2 {
            color: #f87171;
            margin-bottom: 12px;
        }

        .error-overlay p {
            color: var(--text-secondary);
            max-width: 400px;
        }
    </style>
</head>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <span class="loading-text">Initializing JellyOS...</span>
    </div>

    <!-- Full-Screen Canvas for WebGPU 3D Components -->
    <div class="canvas-layer">
        <canvas id="main-canvas"></canvas>
    </div>

    <!-- Glass UI Overlay -->
    <div class="ui-layer">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <span class="topbar-item">🍎 JellyOS</span>
                <span class="topbar-item">File</span>
                <span class="topbar-item">Edit</span>
                <span class="topbar-item">View</span>
            </div>
            <div class="topbar-center">Control Center</div>
            <div class="topbar-right">
                <span class="topbar-item">🔋 100%</span>
                <span class="topbar-item">📶</span>
                <span class="topbar-time" id="clock">12:00</span>
            </div>
        </header>

        <!-- Info Panel for Switch -->
        <div class="info-panel panel-switch">
            <h3>🌙 Dark Mode</h3>
            <p>Click the jelly button to toggle</p>
            <div class="status active" id="theme-status">
                <span class="status-dot"></span>
                <span>Enabled</span>
            </div>
        </div>

        <!-- Info Panel for Slider -->
        <div class="info-panel panel-slider">
            <h3>🔊 Volume</h3>
            <p>Drag the slider to adjust</p>
        </div>

        <!-- Large Volume Value -->
        <div class="value-display" id="slider-value">50%</div>

        <!-- Hint -->
        <div class="hint">Click switch or drag slider to interact</div>

        <!-- Dock -->
        <nav class="dock">
            <div class="dock-item finder active" title="Finder">📁</div>
            <div class="dock-item settings" title="Settings">⚙️</div>
            <div class="dock-item music" title="Music">🎵</div>
            <div class="dock-item photos" title="Photos">🖼️</div>
            <div class="dock-item terminal" title="Terminal">💻</div>
        </nav>
    </div>

    <script>
        // Update clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
    <script type="module" src="/os-loader.ts"></script>
</body>

</html>
