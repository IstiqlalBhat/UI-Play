<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="JellyOS - A liquid glass UI prototype" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JellyOS | Liquid Glass Interface</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================
           JellyOS - Liquid Glass Design System
        ======================================== */

        :root {
            /* Glass Colors */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-hover: rgba(255, 255, 255, 0.12);
            --glass-bg-active: rgba(255, 255, 255, 0.16);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-border-light: rgba(255, 255, 255, 0.25);
            --glass-shadow: rgba(0, 0, 0, 0.3);

            /* Text */
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);

            /* Accents */
            --accent-blue: #60a5fa;
            --accent-purple: #a78bfa;
            --accent-pink: #f472b6;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;

            /* Sizing */
            --dock-height: 80px;
            --topbar-height: 32px;
            --window-radius: 16px;
            --icon-size: 56px;

            /* Animation */
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1030 25%, #0f1a2e 50%, #1a0a20 75%, #0a1a1a 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 15s ease-in-out infinite;
        }

        .particle-1 {
            background: #667eea;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .particle-2 {
            background: #f093fb;
            top: 60%;
            right: 10%;
            animation-delay: -5s;
        }

        .particle-3 {
            background: #4ade80;
            bottom: 20%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* ========================================
           Top Bar (Menu Bar)
        ======================================== */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--topbar-height);
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
            font-size: 13px;
        }

        .topbar-item {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .topbar-item:hover {
            background: var(--glass-bg-hover);
        }

        .topbar-time {
            font-weight: 500;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        /* ========================================
           Desktop Area
        ======================================== */
        .desktop {
            position: fixed;
            inset: var(--topbar-height) 0 calc(var(--dock-height) + 16px) 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1;
        }

        /* ========================================
           Window (Glass Panel)
        ======================================== */
        .window {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--window-radius);
            box-shadow:
                0 25px 50px -12px var(--glass-shadow),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 0 rgba(255, 255, 255, 0.1) inset;
            max-width: 900px;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: windowAppear 0.5s var(--spring);
        }

        @keyframes windowAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
        }

        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
            cursor: default;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s var(--spring);
        }

        .window-control:hover {
            transform: scale(1.2);
        }

        .control-close {
            background: #ff5f57;
        }

        .control-minimize {
            background: #ffbd2e;
        }

        .control-maximize {
            background: #28c840;
        }

        .window-title {
            font-weight: 600;
            font-size: 14px;
        }

        .window-actions {
            display: flex;
            gap: 8px;
        }

        .window-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* ========================================
           Control Center Layout
        ======================================== */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (max-width: 600px) {
            .control-grid {
                grid-template-columns: 1fr;
            }
        }

        .control-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s var(--smooth);
        }

        .control-panel:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-light);
        }

        .control-panel.full-width {
            grid-column: 1 / -1;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .panel-icon.blue {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .panel-icon.purple {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .panel-icon.pink {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .panel-icon.green {
            background: linear-gradient(135deg, #22c55e, #15803d);
        }

        .panel-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .panel-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .panel-status {
            margin-left: auto;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--glass-bg);
        }

        .panel-status.active {
            background: linear-gradient(135deg, var(--accent-green), #15803d);
            color: white;
        }

        /* Canvas Container for WebGPU components */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0a1a;
        }

        .canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .canvas-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 26, 0.9);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .canvas-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Slider value display */
        .slider-value {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding: 12px 16px;
            background: var(--glass-bg);
            border-radius: 8px;
        }

        .slider-value .label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .slider-value .value {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========================================
           Dock (App Bar)
        ======================================== */
        .dock {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 25px 50px -12px var(--glass-shadow);
        }

        .dock-item {
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s var(--spring);
            position: relative;
        }

        .dock-item:hover {
            transform: translateY(-8px) scale(1.15);
        }

        .dock-item:active {
            transform: translateY(-4px) scale(1.05);
        }

        .dock-item.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-primary);
        }

        .dock-item.settings {
            background: linear-gradient(135deg, #6b7280, #374151);
        }

        .dock-item.finder {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .dock-item.music {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .dock-item.photos {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .dock-item.terminal {
            background: linear-gradient(135deg, #1f2937, #111827);
        }

        /* ========================================
           Responsive
        ======================================== */
        @media (max-width: 768px) {
            .desktop {
                padding: 12px;
            }

            .window-content {
                padding: 16px;
            }

            .dock {
                bottom: 8px;
                padding: 6px 10px;
                gap: 6px;
            }

            .dock-item {
                width: 48px;
                height: 48px;
                font-size: 22px;
                border-radius: 12px;
            }

            :root {
                --dock-height: 64px;
            }
        }

        /* WebGPU Error */
        .webgpu-error {
            padding: 24px;
            text-align: center;
            color: var(--text-secondary);
        }

        .webgpu-error h3 {
            color: #f87171;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-particles">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
    </div>

    <!-- Top Menu Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-item">🍎 JellyOS</span>
            <span class="topbar-item">File</span>
            <span class="topbar-item">Edit</span>
            <span class="topbar-item">View</span>
        </div>
        <div class="topbar-center">Control Center</div>
        <div class="topbar-right">
            <span class="topbar-item">🔋 100%</span>
            <span class="topbar-item">📶</span>
            <span class="topbar-time" id="clock">12:00</span>
        </div>
    </header>

    <!-- Desktop Area -->
    <main class="desktop">
        <div class="window">
            <div class="window-header">
                <div class="window-controls">
                    <div class="window-control control-close"></div>
                    <div class="window-control control-minimize"></div>
                    <div class="window-control control-maximize"></div>
                </div>
                <span class="window-title">Control Center</span>
                <div class="window-actions"></div>
            </div>

            <div class="window-content">
                <div class="control-grid">

                    <!-- Dark Mode Toggle -->
                    <div class="control-panel">
                        <div class="panel-header">
                            <div class="panel-icon blue">🌙</div>
                            <div class="panel-info">
                                <h3>Dark Mode</h3>
                                <p>Toggle system appearance</p>
                            </div>
                            <span class="panel-status active" id="theme-status">ON</span>
                        </div>
                        <div class="canvas-container">
                            <canvas id="switch-canvas"></canvas>
                            <div class="canvas-loading" id="switch-loading">
                                <div class="loading-spinner"></div>
                                <span class="loading-text">Loading WebGPU...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Sound Control -->
                    <div class="control-panel">
                        <div class="panel-header">
                            <div class="panel-icon purple">🔊</div>
                            <div class="panel-info">
                                <h3>Volume</h3>
                                <p>System audio level</p>
                            </div>
                        </div>
                        <div class="canvas-container">
                            <canvas id="slider-canvas"></canvas>
                            <div class="canvas-loading" id="slider-loading">
                                <div class="loading-spinner"></div>
                                <span class="loading-text">Loading WebGPU...</span>
                            </div>
                        </div>
                        <div class="slider-value">
                            <span class="label">Current Level</span>
                            <span class="value" id="slider-value">50%</span>
                        </div>
                    </div>

                    <!-- Quick Actions Row -->
                    <div class="control-panel">
                        <div class="panel-header">
                            <div class="panel-icon green">📶</div>
                            <div class="panel-info">
                                <h3>Wi-Fi</h3>
                                <p>JellyNetwork</p>
                            </div>
                            <span class="panel-status active">Connected</span>
                        </div>
                    </div>

                    <div class="control-panel">
                        <div class="panel-header">
                            <div class="panel-icon pink">🔵</div>
                            <div class="panel-info">
                                <h3>Bluetooth</h3>
                                <p>2 devices</p>
                            </div>
                            <span class="panel-status active">ON</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Dock -->
    <nav class="dock">
        <div class="dock-item finder active" title="Finder">📁</div>
        <div class="dock-item settings" title="Settings">⚙️</div>
        <div class="dock-item music" title="Music">🎵</div>
        <div class="dock-item photos" title="Photos">🖼️</div>
        <div class="dock-item terminal" title="Terminal">💻</div>
    </nav>

    <script>
        // Update clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
    <script type="module" src="/app-loader.ts"></script>
</body>

</html>
